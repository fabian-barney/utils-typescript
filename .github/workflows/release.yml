name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up npm 11.15.0
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Verify release versions
        run: npm run verify-release-version

      - name: Render release notes
        run: node ./scripts/render-release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md

      - name: Run typecheck
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run cognitive-typescript gate
        run: npm run cognitive-typescript-check

      - name: Run crap-typescript gate
        run: npm run crap-typescript-check

      - name: Build publish artifacts
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts
          cp release-notes.md release-artifacts/release-notes.md

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release-artifacts/
          if-no-files-found: error

  draft:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Create GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --draft --verify-tag \
              --title "${GITHUB_REF_NAME}" --notes-file release-artifacts/release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
              --title "${GITHUB_REF_NAME}" --notes-file release-artifacts/release-notes.md
          fi

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - validate
      - draft
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Set up npm 11.15.0
        run: npm install --global npm@11.15.0

      - name: Download publish artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Publish package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm publish "./release-artifacts/barney-media-utils-typescript-${version}.tgz" --access public

  finalize:
    name: Finalize GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write

    steps:
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Set up npm 11.15.0
        run: npm install --global npm@11.15.0

      - name: Verify published package version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="@barney-media/utils-typescript"
          last_output="npm view produced no output."
          for attempt in {1..10}; do
            view_status=0
            view_output="$(npm view "${package}@${version}" version 2>&1)" || view_status=$?
            if [ "${view_status}" -eq 0 ] && [ "${view_output}" = "${version}" ]; then
              exit 0
            fi

            last_output="${view_output}"
            echo "${package}@${version} is not visible in the npm registry yet (attempt ${attempt}/10)."
            if [ "${attempt}" -lt 10 ]; then
              sleep 15
            fi
          done

          echo "${package}@${version} was not visible in the npm registry after 10 attempts." >&2
          printf 'Last npm view output:\n%s\n' "${last_output}" >&2
          exit 1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false --verify-tag
