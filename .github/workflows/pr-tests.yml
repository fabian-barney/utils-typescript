name: PR Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up npm 11.6.2
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check package contents
        run: npm pack --json --dry-run --ignore-scripts

  cognitive-typescript-gate:
    name: cognitive-typescript Gate
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up npm 11.6.2
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Run cognitive-typescript gate
        run: npm run cognitive-typescript-check

  crap-typescript-gate:
    name: crap-typescript Gate
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up npm 11.6.2
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Run crap-typescript gate
        run: npm run crap-typescript-check
